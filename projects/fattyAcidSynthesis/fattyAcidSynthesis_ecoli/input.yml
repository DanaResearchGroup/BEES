environment:
  temperature: 298.0
  pH: 7.5

database:
  name: ecoli

settings:
  simulation_mode: iterative
  end_time: 3000
  termination_rate_ratio: 0.01
  toleranceMoveToCore: 1e-2
  toleranceKeepInEdge: 0
  toleranceInterruptSimulation: 10
  max_iterations: 100
  max_num_objects_per_iter: 40
  estimate_kinetics: True
  kinetics_estimator: catpred
  kinetics_include_sd: True
  calibrations:
    - fabI_enoyl_reductase_measured_kcat
    - tesa_long_chain_preference
  enzyme_competition: true
  verbose: 20
