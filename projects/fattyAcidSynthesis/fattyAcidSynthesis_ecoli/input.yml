project: fattyAcidSynthesis_ecoli
project_directory: projects/fattyAcidSynthesis/fattyAcidSynthesis_ecoli

# E. coli type II fatty acid synthase (FAS II) - complete reconstituted system
# Based on: Ruppe et al., PNAS 2020 (doi: 10.1073/pnas.2013924117)
# Experimental conditions from Fig. 4A: in vitro reconstituted FAS
# Nine core FAS II enzymes (FabA, FabB, FabD, FabF, FabG, FabH, FabI, FabZ, AcpP) + TesA termination enzyme

species:
  - label: NADPH
    concentration: 1.3
    smiles: NC(=O)C1=CN(C=CC1)[C@H]1O[C@@H](COP(O)(=O)OP(O)(=O)OC[C@@H]2O[C@@H]([C@@H](OP(O)(O)=O)[C@H]2O)N2C=NC3=C(N)N=CN=C23)[C@H](O)[C@@H]1O
    reactive: true

  - label: NADH
    concentration: 1.0
    smiles: NC(=O)C1=CN(C=CC1)[C@@H]1O[C@H](CO[P@](O)(=O)O[P@](O)(=O)OC[C@H]2O[C@H]([C@H](O)[C@@H]2O)N2C=NC3=C(N)N=CN=C23)[C@@H](O)[C@H]1O
    reactive: true

  - label: Malonyl-CoA
    concentration: 0.5
    smiles: CC(C)(COP(=O)(O)OP(=O)(O)OC[C@@H]1[C@H]([C@H]([C@@H](O1)N2C=NC3=C(N=CN=C32)N)O)OP(=O)(O)O)[C@H](C(=O)NCCC(=O)NCCSC(=O)CC(=O)O)O
    reactive: true

  - label: Acetyl-CoA
    concentration: 0.1
    smiles: CC(=O)SCCNC(=O)CCNC(=O)[C@@H](C(C)(C)COP(=O)(O)OP(=O)(O)OC[C@@H]1[C@H]([C@H]([C@@H](O1)N2C=NC3=C(N=CN=C32)N)O)OP(=O)(O)O)O
    reactive: true

  # ACP carrier (phosphopantetheine moiety); modeled as a species, not an enzyme.
  - label: holo-[ACP]
    concentration: 0.01
    smiles: CC(C)(COP(=O)(O)O)[C@H](C(=O)NCCC(=O)NCCS)O
    reactive: true



  # solvent species

  - label: H2O
    concentration: 55.0
    smiles: O
    constant: true
    reactive: true
    solvent: true

  - label: H+
    concentration: 1e-7
    smiles: "[H+]"
    constant: true
    reactive: true

  - label: HEPES
    concentration: 0.01
    smiles: OCCN1CCN(CCS(=O)(=O)O)CC1
    constant: true
    reactive: true

  - label: NaCl
    concentration: 0.15
    smiles: "[Na+].[Cl-]"
    constant: true
    reactive: true

  - label: TCEP
    concentration: 5e-4
    smiles: O=C(O)CCP(CC(=O)O)CC(=O)O
    constant: true
    reactive: true

enzymes:
  # FabA - beta-hydroxyacyl-ACP dehydratase/isomerase
  # Bifunctional: dehydratase (EC 4.2.1.59) for saturated substrates and isomerase
  # (EC 5.3.3.14) for the trans-2-enoyl to cis-3-enoyl rearrangement that opens
  # the unsaturated branch of E. coli FAS II (yields palmitoleate & cis-vaccenate).
  # UniProt: P0A6Q3 (E. coli K-12)
  - label: FabA
    concentration: 0.001
    ecnumber:
      - EC 4.2.1.59
      - EC 5.3.3.14
    reactive: true
    amino_acid_sequence: MVDKRESYTKEDLLASGRGELFGAKGPQLPAPNMLMMDRVVKMTETGGNFDKGYVEAELDINPDLWFFGCHFIGDPVMPGCLGLDAMWQLVGFYLGWLGGEGKGRALGVGEVKFTGQVLPTAKKVTYRIHFKRIVNRRLIMGLADGEVLVDGRLIYTASDLKVGLFQDTSAF

  # FabB - beta-ketoacyl-ACP synthase I
  # Elongates cis-dec-3-enoyl-ACP by condensation with malonyl-ACP; essential for
  # unsaturated fatty acid biosynthesis; partially redundant with FabF
  # UniProt: P0A953 (E. coli K-12)
  - label: FabB
    concentration: 0.001
    ecnumber: EC 2.3.1.41
    reactive: true
    amino_acid_sequence: 

  # FabD - malonyl-CoA:ACP transacylase
  # Transfers malonyl group from malonyl-CoA to ACP to form malonyl-ACP, the main
  # chain-extension substrate for all condensation steps
  # UniProt: P0AAI9 (E. coli K-12)
  - label: FabD
    concentration: 0.001
    ecnumber: EC 2.3.1.39
    reactive: true
    amino_acid_sequence: 

  # FabF - beta-ketoacyl-ACP synthase II
  # Responsible for elongation of palmitoyl-ACP (C16:0) to stearoyl-ACP (C18:0);
  # partially redundant with FabB but with distinct substrate specificity at C16
  # UniProt: P0AAI5 (E. coli K-12)
  - label: FabF
    concentration: 0.001
    ecnumber: EC 2.3.1.179
    reactive: true
    amino_acid_sequence: 

  # FabG - beta-ketoacyl-ACP reductase
  # Reduces the beta-keto group of beta-ketoacyl-ACP intermediates to beta-hydroxyacyl-ACP
  # using NADPH; acts on all chain lengths (C4-C16)
  # UniProt: P0AEK2 (E. coli K-12)
  - label: FabG
    concentration: 0.001
    ecnumber: EC 1.1.1.100
    reactive: true
    amino_acid_sequence: MNFEGKIALVTGASRGIGRAIAETLAARGAKVIGTATSENGAQAISDYLGANGKGLMLNVTDPASIESVLEKIRAEFGEVDILVNNAGITRDNLLMRMKDEEWNDIIETNLSSVFRLSKAVMRAMMKKRHGRIITIGSVVGTMGNGGQANYAAAKAGLIGFSKSLAREVASRGITVNVVAPGFIETDMTRALSDDQRAGILAQVPAGRLGGAQEIANAVAFLASDEAAYITGETLHVNGGMYMV

  # FabH - beta-ketoacyl-ACP synthase III
  # Initiates fatty acid synthesis by condensing acetyl-CoA directly with malonyl-ACP
  # to form acetoacetyl-ACP (C4); controls overall flux through the FAS cycle
  # UniProt: P0A6R0 (E. coli K-12)
  - label: FabH
    concentration: 0.001
    ecnumber: EC 2.3.1.180
    reactive: true
    amino_acid_sequence: 

  # FabI - enoyl-ACP reductase I (NADH-dependent)
  # Catalyzes the final reduction step in each elongation cycle, converting
  # trans-2-enoyl-ACP to acyl-ACP using NADH; the committed step of each cycle
  # UniProt: P0AEK4 (E. coli K-12)
  - label: FabI
    concentration: 0.001
    ecnumber: EC 1.3.1.9
    reactive: true
    amino_acid_sequence: MGFLSGKRILVTGVASKLSIAYGIAQAMHREGAELAFTYQNDKLKGRVEEFAAQLGSDIVLQCDVAEDASIDTMFAELGKVWPKFDGFVHSIGFAPGDQLDGDYVNAVTREGFKIAHDISSYSFVAMAKACRSMLNPGSALLTLSYLGAERAIPNYNVMGLAKASLEANVRYMANAMGPEGVRVNAISAGPIRTLAASGIKDFRKMLAHCEAVTPIRRTVTIEDVGNSAAFLCSDLSAGISGEVVHVDGGFSIAAMNELELK

  # FabZ - beta-hydroxyacyl-ACP dehydratase
  # Dehydrates beta-hydroxyacyl-ACP to trans-2-enoyl-ACP; preference for C4-C6 substrates
  # and unsaturated beta-hydroxyacyl-ACPs; functionally redundant with FabA on several substrates
  # UniProt: P0A6Q6 (E. coli K-12)
  - label: FabZ
    concentration: 0.001
    ecnumber: EC 4.2.1.59
    reactive: true
    amino_acid_sequence: MTTNTHTLQIEEILELLPHRFPFLLVDRVLDFEEGRFLRAVKNVSVNEPFFQGHFPGKPIFPGVLILEAMAQATGILAFKSVGKLEPGELYYFAGIDEARFKRPVVPGDQMIMEVTFEKTRRGLTRFKGVALVDGKVVCEATMMCARSREA

  # TesA - thioesterase I (*TesA cytoplasmic form)
  # Releases free fatty acids from acyl-ACP intermediates enables production 
  # of free fatty acids
  # UniProt: P0ADA1 (E. coli K-12)
  - label: TesA
    concentration: 0.01
    ecnumber: EC 3.1.2.14
    reactive: true
    amino_acid_sequence: MMNFNNVFRWHLPFLFLVLLTFRAAAADTLLILGDSLSAGYRMSASAAWPALLNDKWQSKTSVVNASISGDTSQQGLARLPALLKQHQPRWVLVELGGNDGLRGFQPQQTEQTLRQILQDVKAANAEPLLMQIRLPANYGRRYNEAFSAIYPKLAKEFDVPLLPFFMEEVYLKPQWMQDDGIHPNRDAQPFIADWMAKQLQPLVNHDS

environment:
  temperature: 298.0
  pH: 7.4

database:
  name: ecoli

settings:
  end_time: 800 # 12.5 min (matches reference experiment)
  toleranceMoveToCore: 1e-5
  toleranceKeepInEdge: 1e-7
  toleranceInterruptSimulation: 1e-5
  max_iterations: 60
  max_num_objects_per_iter: 40
  estimate_kinetics: True
  kinetics_estimator: catpred
  kinetics_include_sd: True
  verbose: 20
