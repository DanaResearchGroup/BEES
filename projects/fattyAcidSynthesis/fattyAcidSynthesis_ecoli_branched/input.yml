  # PlsB - glycerol-3-phosphate acyltransferase (EC 2.3.1.15)
  # Competes directly for acyl-ACP/acyl-CoA intermediates to make lysophosphatidic acid.
  # At low concentration: creates edge species from acyl-ACPs that don't dominate FAS flux.
  # UniProt: P0A7A7 (E. coli K-12)
  - label: PlsB
    concentration: 0.0002
    ecnumber: EC 2.3.1.15
    reactive: true
    amino_acid_sequence: 

  # PlsC - 1-acylglycerol-3-phosphate acyltransferase (EC 2.3.1.51)
