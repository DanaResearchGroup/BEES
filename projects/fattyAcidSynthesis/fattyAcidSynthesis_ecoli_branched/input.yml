project: fattyAcidSynthesis_ecoli_branched
project_directory: projects/fattyAcidSynthesis/fattyAcidSynthesis_ecoli_branched

# E. coli FAS II + branching enzymes
# Purpose: test RMG-style edge species at convergence.
# Added over the base FAS II input:
#   - PlsB (EC 2.3.1.15): competes for acyl-ACPs/CoAs -> phospholipid branch
#   - PlsC (EC 2.3.1.51): downstream of PlsB -> diacyl-phosphate branch
#   - AccAB (EC 2.1.3.15) + AccBC (EC 6.3.4.14): Acetyl-CoA carboxylase,
#     replenishes Malonyl-CoA creating a feedback loop on the FAS substrate pool
#   - FadB (EC 1.1.1.35/4.2.1.17/5.1.2.3/5.3.3.8) + FadA (EC 2.3.1.16):
#     beta-oxidation complex, competes for acyl-CoA intermediates
#   New species: sn-glycerol 3-phosphate (PlsB substrate)

species:
  - label: NADPH
    concentration: 1.3
    smiles: NC(=O)C1=CN(C=CC1)[C@H]1O[C@@H](COP(O)(=O)OP(O)(=O)OC[C@@H]2O[C@@H]([C@@H](OP(O)(O)=O)[C@H]2O)N2C=NC3=C(N)N=CN=C23)[C@H](O)[C@@H]1O
    reactive: true

  - label: NADH
    concentration: 1.0
    smiles: NC(=O)C1=CN(C=CC1)[C@@H]1O[C@H](CO[P@](O)(=O)O[P@](O)(=O)OC[C@H]2O[C@H]([C@H](O)[C@@H]2O)N2C=NC3=C(N)N=CN=C23)[C@@H](O)[C@H]1O
    reactive: true

  - label: Malonyl-CoA
    concentration: 0.5
    smiles: CC(C)(COP(=O)(O)OP(=O)(O)OC[C@@H]1[C@H]([C@H]([C@@H](O1)N2C=NC3=C(N=CN=C32)N)O)OP(=O)(O)O)[C@H](C(=O)NCCC(=O)NCCSC(=O)CC(=O)O)O
    reactive: true

  - label: Acetyl-CoA
    concentration: 0.1
    smiles: CC(=O)SCCNC(=O)CCNC(=O)[C@@H](C(C)(C)COP(=O)(O)OP(=O)(O)OC[C@@H]1[C@H]([C@H]([C@@H](O1)N2C=NC3=C(N=CN=C32)N)O)OP(=O)(O)O)O
    reactive: true

  # ACP carrier
  - label: holo-[ACP]
    concentration: 0.01
    smiles: CC(C)(COP(=O)(O)O)[C@H](C(=O)NCCC(=O)NCCS)O
    reactive: true

  # PlsB substrate — glycerol backbone for phospholipid branch
  - label: sn-glycerol 3-phosphate
    concentration: 0.5
    smiles: C([C@H](COP(=O)(O)O)O)O
    reactive: true

  # PlsB acyl donor — palmitoyl-CoA (C16:0), the dominant FAS II product.
  # Present at low concentration so PlsB's forward reaction (acyl-CoA + G3P -> lysoPA + CoA)
  # is generated from iteration 1, rather than waiting for TesA to make it.
  - label: hexadecanoyl-CoA
    concentration: 0.001
    smiles: CCCCCCCCCCCCCCCC(=O)SCCNC(=O)CCNC(=O)[C@@H](C(C)(C)COP(=O)(O)OP(=O)(O)OC[C@@H]1[C@H]([C@H]([C@@H](O1)N2C=NC3=C(N=CN=C32)N)O)OP(=O)(O)O)O
    reactive: true

  # Solvent / buffer species
  - label: H2O
    concentration: 55.0
    smiles: O
    constant: true
    reactive: true
    solvent: true

  - label: H+
    concentration: 1e-7
    smiles: "[H+]"
    constant: true
    reactive: true

  - label: HEPES
    concentration: 0.01
    smiles: OCCN1CCN(CCS(=O)(=O)O)CC1
    constant: true
    reactive: true

  - label: NaCl
    concentration: 0.15
    smiles: "[Na+].[Cl-]"
    constant: true
    reactive: true

  - label: TCEP
    concentration: 5e-4
    smiles: O=C(O)CCP(CC(=O)O)CC(=O)O
    constant: true
    reactive: true

