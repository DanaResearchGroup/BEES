environment:
  temperature: 298.0
  pH: 7.5

# Doses (mM): thiolactomycin 0.2, triclosan 0.01, each as a liposome (10 % with a 12 min
# half-life, 90 % with 4.5 h: the 2 h / 45 h of the sweep x 0.1), free drug cleared with a
# 30 min half-life.
dosing:
  - species: thiolactomycin
    profile: biexponential
    dose: 0.2
    params: {fraction_fast: 0.1, half_life_fast: 720, half_life_slow: 16200}
    elimination_half_life: 1800
  - species: triclosan
    profile: biexponential
    dose: 0.01
    params: {fraction_fast: 0.1, half_life_fast: 720, half_life_slow: 16200}
    elimination_half_life: 1800

database:
  name: ecoli

settings:
  simulation_mode: iterative
  end_time: 21600   # 6 h
  time_step: 60
  toleranceMoveToCore: 1e-2
  toleranceKeepInEdge: 0
  toleranceInterruptSimulation: 10
  max_iterations: 100
  max_num_objects_per_iter: 40
  estimate_kinetics: false
  enzyme_competition: true
  verbose: 20
