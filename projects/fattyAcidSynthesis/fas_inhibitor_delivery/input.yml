# E. coli FAS II with two inhibitors and three delivery profiles.
#
# Copy of ../fattyAcidSynthesis_ecoli (same enzymes, db/ecoli.csv) with
#   - the two drugs as species that enter only through `dosing`,
#   - `inhibition` on the target enzymes,
#   - PLACEHOLDER kinetics (measured_kinetics) so that it runs without CatPred. The kcats are
#     rounded order-of-magnitude values; the Kms of acyl-ACPs are one default of 0.02 mM and
#     TesA's long-chain preference is imitated with a high Km on short acyl-ACPs. The
#     calibrations of the original input are not used. Nothing here is a result about biology.
#
# Supply: NADPH, NADH, malonyl-CoA and acetyl-CoA are held constant (a cell keeps them topped up),
# so the output is a flux and not a batch that runs out of malonyl-CoA within half an hour.
#
# Drugs
#   triclosan      FabI, tight binding, Ki = 7e-9 mM (Ward et al. 1999 - VERIFY the value)
#   thiolactomycin FabH / FabB / FabF, competitive against malonyl-[ACP],
#                  Ki = 0.05 / 0.02 / 0.02 mM (PLACEHOLDERS)
# Doses are the ones of the README; devtools/release_sweep.py compares delivery profiles of
# one drug at a time (use --time-scale 0.1 for the 6 h run).
project: fas_inhibitor_delivery
project_directory: projects/fattyAcidSynthesis/fas_inhibitor_delivery

species:
  - label: NADPH
    concentration: 1
    smiles: NC(=O)C1=CN(C=CC1)[C@H]1O[C@@H](COP(O)(=O)OP(O)(=O)OC[C@@H]2O[C@@H]([C@@H](OP(O)(O)=O)[C@H]2O)N2C=NC3=C(N)N=CN=C23)[C@H](O)[C@@H]1O
    constant: true
    reactive: true

  - label: NADH
    concentration: 1.0
    smiles: NC(=O)C1=CN(C=CC1)[C@@H]1O[C@H](CO[P@](O)(=O)O[P@](O)(=O)OC[C@H]2O[C@H]([C@H](O)[C@@H]2O)N2C=NC3=C(N)N=CN=C23)[C@@H](O)[C@H]1O
    constant: true
    reactive: true

  - label: Malonyl-CoA
    concentration: 0.5
    smiles: CC(C)(COP(=O)(O)OP(=O)(O)OC[C@@H]1[C@H]([C@H]([C@@H](O1)N2C=NC3=C(N=CN=C32)N)O)OP(=O)(O)O)[C@H](C(=O)NCCC(=O)NCCSC(=O)CC(=O)O)O
    constant: true
    reactive: true

  - label: Acetyl-CoA
    concentration: 0.5
    smiles: CC(=O)SCCNC(=O)CCNC(=O)[C@@H](C(C)(C)COP(=O)(O)OP(=O)(O)OC[C@@H]1[C@H]([C@H]([C@@H](O1)N2C=NC3=C(N=CN=C32)N)O)OP(=O)(O)O)O
    constant: true
    reactive: true

  - label: holo-[ACP]
    concentration: 0.01
    smiles: CC(C)(COP(=O)(O)O)[C@H](C(=O)NCCC(=O)NCCS)O
    reactive: true

  - label: H2O
    concentration: 55500.0 # pure water, 55.5 M in mM (solvent; not used in rate laws)
    smiles: O
    constant: true
    reactive: true
    solvent: true

  - label: H+
    concentration: 3.16e-5 # pH 7.5 (effect of the 100 mM sodium phosphate)
    smiles: "[H+]"
    constant: true
    reactive: true

# Buffers
  - label: sodium phosphate 
    concentration: 100.0
    smiles: "[Na+].[Na+].OP([O-])([O-])=O"
    constant: true
    reactive: false

  - label: TCEP # buffer; reducing agent
    concentration: 1.0
    smiles: O=C(O)CCP(CC(=O)O)CC(=O)O
    constant: true
    reactive: false

  # Drugs: only enter through `dosing`
  - label: triclosan
    concentration: 0
    smiles: Oc1cc(Cl)ccc1Oc1ccc(Cl)cc1Cl
    reactive: false
  - label: thiolactomycin
    concentration: 0
    smiles: C=CC(C)=CC1(C)SC(=O)C(C)=C1O
    reactive: false

