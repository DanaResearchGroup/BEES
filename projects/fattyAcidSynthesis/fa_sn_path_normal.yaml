    \ </ci> </apply></apply>\n\t\t\t<apply> <divide /> <ci> acoa_cyt </ci>  <apply> <plus /> <ci> acoa_cyt </ci> <ci> km_ACC1_native_acoa_cyt\
    \ </ci> </apply></apply>\n\t\t\t<apply> <divide /> <ci> hco3_cyt </ci>  <apply> <plus /> <ci> hco3_cyt </ci> <ci> km_ACC1_native_hco3_cyt\
    \ </ci> </apply></apply>\n\t\t</apply>\n\t\t\n\t</math>"
