pathway:
  name: Fatty Acid Synthesis Normal Path
  entry_metabolite: Citrate
  exit_metabolite: Palmitoyl-CoA
  description: 'Complete de novo lipogenesis pathway: Citrate → Acetyl-CoA → Malonyl-CoA → Palmitoyl-CoA (C16:0) via iterative
    elongation steps. Note: Palmitoyl-CoA can be hydrolyzed to Palmitate (free fatty acid) by thioesterases, but this step
    is not included in the core pathway.'
  species_mapping:
    cit_cyt: Citrate
    acoa_cyt: Acetyl-CoA
    malcoa_cyt: Malonyl-CoA
    c4_coa_cyt: Butyryl-CoA
    c6_coa_cyt: Hexanoyl-CoA
    c8_coa_cyt: Octanoyl-CoA
    c10_coa_cyt: Decanoyl-CoA
    c12_coa_cyt: Dodecanoyl-CoA
    c14_coa_cyt: Tetradecanoyl-CoA
    c16_coa_cyt: Palmitoyl-CoA
    c16_cyt: Palmitate
    atp_cyt: ATP
    adp_cyt: ADP
    p_cyt: Pi
    coa_cyt: CoA
    oaa_cyt: Oxaloacetate
    nadph_cyt: NADPH
    nadp_cyt: NADP+
    hco3_cyt: HCO3-
reactions:
- step_number: 1
  enzyme_name: ATP Citrate Lyase
  ec_number: EC 2.3.3.8
  reaction_id: CIT_LYS
  reactants:
  - Citrate
  - CoA
  - ATP
  products:
  - Acetyl-CoA
  - Oxaloacetate
  - ADP
  - Pi
  stoichiometry:
    Citrate: -1
    CoA: -1
    ATP: -1
    Acetyl-CoA: 1
    Oxaloacetate: 1
    ADP: 1
    Pi: 1
  cofactors:
  - Mg2+
  reversible: false
  description: Cleavage of citrate to produce acetyl-CoA and oxaloacetate
  kinetic_parameters:
    km_values:
      Citrate: 0.17
      CoA: 0.0065
      ATP: 0.172
    default_km: 0.17
    default_kcat: 10.5
    default_ki: 0.171
    keq: 0.00892
  parameter_source: Hepatokin1 SBML Model
  references:
  - Berndt N, et al. Kinetic modelling of quantitative proteome data predicts metabolic reprogramming of liver cancer. Br
    J Cancer. 2019;122(2):233-244. doi:10.1038/s41416-019-0659-3
  rate_law_type: Reversible Michaelis-Menten
  rate_law_equation: v = vmax * (Citrate*CoA*ATP - Acetyl-CoA*ADP*Pi*OAA/Keq) / ((Citrate+Km_cit)*(CoA+Km_coa)*(ATP+Km_atp))
  rate_law_mathml: "<math xmlns=\"http://www.w3.org/1998/Math/MathML\">\n\t\t<apply> <times /><ci> vmax_CIT_LYS </ci> \n\t\
    \t\t<apply> <divide />  \n\t\t\t\t<apply> <minus /> \n\t\t\t\t\t<apply> <times />\n\t\t\t\t\t\t<ci> cit_cyt </ci>\n\t\t\
    \t\t\t\t<ci> coa_cyt </ci> \n\t\t\t\t\t\t<ci> atp_cyt </ci> \n\t\t\t\t\t</apply>\n\t\t\t\t\t<apply> <divide />\n\t\t\t\
    \t\t\t<apply> <times /> \n\t\t\t\t\t\t\t<ci> acoa_cyt </ci> \n\t\t\t\t\t\t\t<ci> adp_cyt </ci> \n\t\t\t\t\t\t\t<ci> p_cyt\
    \ </ci> \n\t\t\t\t\t\t\t<ci> oaa_cyt </ci> \n\t\t\t\t\t\t</apply> \n\t\t\t\t\t\t<ci> keq_CIT_LYS </ci>  \n\t\t\t\t\t</apply>\n\
    \t\t\t\t</apply>\n\t\t\t\t<apply> <times />   \n\t\t\t\t\t<apply> <plus /> <ci> cit_cyt </ci> <ci> km_CIT_LYS_cit_cyt\
    \ </ci>  </apply> \n\t\t\t\t\t<apply> <plus /> <ci> coa_cyt </ci> <ci> km_CIT_LYS_coa_cyt </ci>  </apply> \n\t\t\t\t\t\
    <apply> <plus /> <ci> atp_cyt </ci> <ci> km_CIT_LYS_atp_cyt </ci>  </apply> \n\t\t\t\t</apply>\n\t\t\t</apply>\n\t\t</apply>\n\
    \t</math>"
